name: reliability-gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - run: pytest -q
      - run: python -m src.dili_control_plane.cli examples/production-api.json --evidence evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-control-evidence
          path: evidence.json

  terraform-static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
